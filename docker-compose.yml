# Starts the website and database together with one command: `docker compose up`.
services:
  web:
    # Builds the PHP/Apache image from the project's Dockerfile.
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    # Gives the PHP application the settings from the project's `.env` file.
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: mariadb:11
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # The database uses port 3307 on your Mac so it does not clash with XAMPP or
    # another local MySQL/MariaDB using port 3306. PHP connects to it internally.
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Initializes an empty database in filename order: structure, views, triggers, then baseline data.
      # These scripts do not run again on normal restarts because data is kept in `db_data`.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/views.sql:/docker-entrypoint-initdb.d/02-views.sql
      - ./database/triggers.sql:/docker-entrypoint-initdb.d/03-triggers.sql
      - ./database/seeddata.sql:/docker-entrypoint-initdb.d/04-seeddata.sql

volumes:
  db_data:
