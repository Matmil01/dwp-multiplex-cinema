# `docker compose up` starts every service below at once, no separate commands needed
services:
  web:
    image: php:8.3-apache
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    # loads TMDB_* and DB_* vars (and anything else in .env) into the container's environment for getenv() to read
    env_file:
      - .env
    depends_on:
      - db
    # Serve from public/ instead of the project root
    # -E with an optional (/public)? group keeps this rewrite idempotent if the container restarts without being recreated
    command: >
      bash -c "docker-php-ext-install pdo_mysql mysqli
      && sed -i -E 's#/var/www/html(/public)?#/var/www/html/public#g' /etc/apache2/sites-available/000-default.conf /etc/apache2/apache2.conf
      && apache2-foreground"
    # runs alongside `web`, only job is rebuilding dist.css on file changes
  
  tailwind:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      # anonymous volume shadows the host's node_modules so the container gets its own Linux native bindings instead of the host's macOS ones
      - /app/node_modules
    command: sh -c "npm install && npx @tailwindcss/cli -i ./public/assets/main.css -o ./public/assets/dist.css --watch"

  db:
    image: mariadb:11
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    # host-side 3307 avoids clashing with a local MySQL/MariaDB already using 3306; only needed for optional GUI access, "web" always reaches this over the compose network as "db:3306"
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # auto-run once against an empty data dir on first boot only, not on every restart
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  db_data:
